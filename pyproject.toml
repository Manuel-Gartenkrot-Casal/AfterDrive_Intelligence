# Ruff configuration for AfterDrive Intelligence
# https://docs.astral.sh/ruff/

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (Flask routes)
]

[tool.ruff.lint.isort]
known-first-party = ["afterdrive"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[project]
name = "after-drive-intelligence"
version = "0.1.0"
dependencies = [
    "flask",
    "flask-cors"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.vercel]
entrypoint = "afterdrive/flask_api.py"
