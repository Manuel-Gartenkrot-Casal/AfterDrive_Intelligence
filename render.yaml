# Blueprint de Render — un solo web service (API + dashboard en el mismo contenedor).
# Flask sirve la API en /api/* y el dashboard estático en la raíz (/).
# Si ya tenés el servicio manual `afterdrive-intelligence` creado, este archivo no
# es necesario: el mismo Dockerfile raíz se auto-despliega con cada push a main.
services:
  - type: web
    name: afterdrive-intelligence
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: "mistralai/mistral-small-3.1-24b-instruct:free"
      - key: MONGO_URI
        sync: false
      - key: FORCE_PROFILE
        value: ""
      - key: DISABLE_BROWSER
        value: "false"