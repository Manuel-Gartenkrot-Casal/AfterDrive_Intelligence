# Blueprint de Render — un solo web service (API + dashboard en el mismo contenedor).
# Flask sirve la API en /api/* y el dashboard estático en la raíz (/).
# OJO: si ya tenés el servicio manual `afterdrive-intelligence` creado desde el
# dashboard, aplicar este Blueprint puede duplicarlo o pedir confirmación de nombre.
services:
  - type: web
    name: afterdrive-intelligence
    runtime: docker
    branch: Render_Testing
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: AI_PROVIDER
        value: openrouter
      # OpenRouter no expone /embeddings: los embeddings tienen que ir por otro
      # proveedor o no se calculan. Requiere NVIDIA_API_KEY y NVIDIA_EMB_MODEL.
      - key: EMBEDDINGS_PROVIDER
        value: nvidia
      - key: NVIDIA_API_KEY
        sync: false
      # Verificar contra el catálogo del proveedor antes de fijarlo: un modelo
      # dado de baja devuelve 410 y los embeddings quedan en None.
      - key: NVIDIA_EMB_MODEL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: "mistralai/mistral-small-3.1-24b-instruct:free"
      - key: MONGO_URI
        sync: false
      - key: FORCE_PROFILE
        value: ""
      - key: DISABLE_BROWSER
        value: "false"
      # URL pública del servicio. Render la inyecta automáticamente; se usa
      # para el keep-alive (ver flask_api.py) y para cualquier callback externo.
      - key: RENDER_EXTERNAL_URL
        sync: false
      # Acceso al dashboard. Sin ADMIN_USER, ADMIN_PASSWORD_HASH y SECRET_KEY
      # nadie puede entrar (ver .env.example para generar el hash).
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # Autoriza a los cron de abajo (y a cualquier monitor externo) a disparar corridas.
      - key: CRON_TOKEN
        generateValue: true

# ────────────────────────────────────────────────────────────────────────────────
# CRON JOBS (SOLO PLAN PAGO — Render no permite cron en free tier)
#
# Un cron de Render corre un COMANDO en una instancia aparte (schema exige
# `runtime` + `startCommand`, no "request"). Acá el comando hace un POST HTTP al
# endpoint del web service: eso despierta la instancia y dispara scraping/generación.
#
# Si querés esto en free tier NO es posible con cron de Render. La alternativa
# gratis y más confiable es el keep-alive interno (ya corregido para pegar a la
# URL pública) + un monitor externo (cron-job.org / UptimeRobot) pegando a:
#   POST https://afterdrive-intelligence.onrender.com/api/run-automation   (scraping)
#   POST https://afterdrive-intelligence.onrender.com/api/run-generacion  (generación)
# con el header "Authorization: Bearer <CRON_TOKEN>": sin él responden 401.
# ────────────────────────────────────────────────────────────────────────────────
  - type: cron
    name: afterdrive-scrape-diario
    runtime: python
    branch: Render_Testing
    schedule: "30 8 * * *"   # 08:30 UTC = 05:30 ART
    plan: starter            # cron no existe en plan free
    buildCommand: pip install requests
    envVars:
      - key: CRON_TOKEN
        fromService:
          type: web
          name: afterdrive-intelligence
          envVarKey: CRON_TOKEN
    startCommand: python -c "import os, requests; requests.post('https://afterdrive-intelligence.onrender.com/api/run-automation', headers=dict(Authorization='Bearer ' + os.environ['CRON_TOKEN']), timeout=120).raise_for_status()"
  - type: cron
    name: afterdrive-generacion-diaria
    runtime: python
    branch: Render_Testing
    schedule: "0 14 * * *"   # 14:00 UTC = 11:00 ART
    plan: starter            # cron no existe en plan free
    buildCommand: pip install requests
    envVars:
      - key: CRON_TOKEN
        fromService:
          type: web
          name: afterdrive-intelligence
          envVarKey: CRON_TOKEN
    startCommand: python -c "import os, requests; requests.post('https://afterdrive-intelligence.onrender.com/api/run-generacion', headers=dict(Authorization='Bearer ' + os.environ['CRON_TOKEN']), timeout=120).raise_for_status()"